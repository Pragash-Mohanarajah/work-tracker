name: Generate Work Tracker Metrics

on:
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      API_SECRET_TOKEN: ${{ secrets.API_SECRET_TOKEN }}
      STATS_URL: ${{ vars.STATS_URL }}
      SECTION_NAME: WORK_TRACKER
      COMMIT_MESSAGE: Generate Work Tracker Metrics
      SYMBOL_VERSION: 1
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Work Tracker
        run: node scripts/index.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "$COMMIT_MESSAGE" || echo "No changes to commit"
          git push