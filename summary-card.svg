
    <svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
      
  <style>
    .card-bg { fill: #ffffff; stroke: #d0d7de; }
    .text-main { fill: #24292f; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    .text-sub { fill: #57606a; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    .accent { fill: #0969da; }
    .accent-stroke { stroke: #0969da; }
    .grid-line { stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .card-bg { fill: #0d1117; stroke: #30363d; }
      .text-main { fill: #f0f6fc; }
      .text-sub { fill: #8b949e; }
      .accent { fill: #58a6ff; }
      .accent-stroke { stroke: #58a6ff; }
      .grid-line { stroke: #30363d; }
    }
  </style>

      <rect width="100%" height="100%" class="card-bg" rx="12" />
      <text x="20" y="30" class="text-main" font-size="14" font-weight="bold">Pragash's Developer Snapshot</text>
      <line x1="20" y1="45" x2="780" y2="45" class="grid-line" stroke-dasharray="2,2" />
      
      <text x="30" y="65" class="text-sub" font-size="10" text-anchor="start">Total Commits</text>
      <text x="30" y="85" class="text-main" font-size="18" font-weight="800" text-anchor="start">7115</text>
    
      <text x="225" y="65" class="text-sub" font-size="10" text-anchor="start">Streak</text>
      <text x="225" y="85" class="text-main" font-size="18" font-weight="800" text-anchor="start">7 Days</text>
    
      <text x="420" y="65" class="text-sub" font-size="10" text-anchor="start">Estimated LOC</text>
      <text x="420" y="85" class="text-main" font-size="18" font-weight="800" text-anchor="start">2432.5k</text>
    
      <text x="615" y="65" class="text-sub" font-size="10" text-anchor="start">Account Age</text>
      <text x="615" y="85" class="text-main" font-size="18" font-weight="800" text-anchor="start">1909 Days</text>
    
    </svg>
  